version: '3.8'

services:
  php:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./:/var/www/html
    env_file:
      - .env
    networks:
      - wano_network

  nginx:
    image: nginx:alpine
    ports:
      - "8005:80"
    volumes:
      - ./:/var/www/html
      - ./docker/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - wano_network
networks:
  wano_network:
    driver: bridge