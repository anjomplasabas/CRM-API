image: docker:stable
services:
  - name: docker:dind
stages:
  - build_dev
  - deploy_dev
variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  CLUSTER_NAME: wano
  IMAGE_NAME: wano-api
  DOCKER_REGISTRY: 382245600848.dkr.ecr.ap-southeast-1.amazonaws.com
  AWS_DEFAULT_REGION: ap-southeast-1
  AWS_ACCESS_KEY_ID: $ECR_AWS_ACCESS_KEY_ID
  AWS_SECRET_ACCESS_KEY: $ECR_AWS_SECRET_ACCESS_KEY
  TASK_DEFINITION_NAME: wano-api
  SERVICE_NAME: wano-api
include: 
  - 'docker/deployment/dev-build.yml'
  - 'docker/deployment/dev-deploy.yml'