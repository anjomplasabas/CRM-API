services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\Tests\:
        resource: '../tests/'
        exclude:
            - '../tests/Fixtures/'
            - '../tests/bootstrap.php'

    App\Service\ThirdParty\FirebaseDatabase:
        class: App\Tests\Support\FakeFirebaseDatabase

    App\Service\ThirdParty\FacebookService:
        class: App\Tests\Support\FakeFacebookService
        arguments: []

    # Public aliases so tests can fetch services from the container.
    test.App\Tests\Support\FakeFirebaseDatabase:
        alias: App\Service\ThirdParty\FirebaseDatabase
        public: true

    test.App\Tests\Support\FakeFacebookService:
        alias: App\Service\ThirdParty\FacebookService
        public: true
