build_image_develop_ecs:
  stage: build_dev
  before_script:
    # Create .env
    # - cp .docker/php/.env-template wano-api/.env
    # - ls -la /builds/outcrate/wano-api
    - apk add --no-cache curl jq python3 py3-pip docker-buildx
    - pip install awscli
    - aws ecr get-login-password | docker login --username AWS --password-stdin $DOCKER_REGISTRY
    # Install Buildx
    - curl -sSL https://github.com/docker/buildx/releases/download/v0.10.2/buildx-v0.10.2.linux-amd64 > /usr/local/bin/docker-buildx && chmod +x /usr/local/bin/docker-buildx
    - docker buildx version || echo "Buildx installation failed."
    # Create and use buildx builder
    - docker buildx create --name mybuilder --use
    - docker buildx inspect mybuilder --bootstrap
  script:
    # Copy environment file
    # - cat $DEVELOP_ENV
    # - cp $DEVELOP_ENV .env
    # - ls -la
    # Use docker buildx create --use
    # Display updated .env
    - cat .env
    # Build docker image
    - docker buildx build --platform linux/amd64,linux/arm64 -f docker/Dockerfile -t $DOCKER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA .
    # Tagg docker image
    # List docker images
    - docker images
    # Login and push image to gitlab registry
    - docker push $DOCKER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA
    - docker image rm $DOCKER_REGISTRY/$IMAGE_NAME:$CI_COMMIT_SHA
  only:
    - main